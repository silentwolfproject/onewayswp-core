[package]
name = "onewayswp-core"
version = "0.1.0"
edition = "2024"
description = "OnewaySWP Core Engine"
license = "MIT"
authors = ["Juan Hulu"]

[lib]
name = "onewayswp_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
blake3 = "1.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
dirs = "5.0"
once_cell = "1.19"
hostname = "0.4"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true