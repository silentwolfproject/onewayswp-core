name: Build Multi-Platform

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: windows-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            name: linux-armv7
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
          - target: aarch64-linux-android
            os: ubuntu-latest
            name: android-arm64
            cross: true
          - target: armv7-linux-androideabi
            os: ubuntu-latest
            name: android-armv7
            cross: true
          - target: x86_64-linux-android
            os: ubuntu-latest
            name: android-x64
            cross: true
          - target: i686-linux-android
            os: ubuntu-latest
            name: android-x86
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          find target/${{ matrix.target }}/release -maxdepth 1 \
            \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" -o -name "*.a" \) \
            -exec cp {} dist/ \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: onewayswp-${{ matrix.name }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            mkdir -p "release/$name"
            cp -r "$dir"* "release/$name/" 2>/dev/null || true
          done
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*